name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS slices are built on an Apple Silicon runner; Xcode ships
          # the x86_64 SDK, and serv has no C dependencies to get in the way.
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          # musl, so one Linux binary runs on any distribution regardless of
          # how old its glibc is.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install musl tooling
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="serv-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/serv" "dist/${name}/serv"
          cp README.md LICENSE "dist/${name}/"
          tar -czf "${name}.tar.gz" -C dist "${name}"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -f *.sha256
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            echo "Prebuilt binaries for macOS (Apple Silicon and Intel) and Linux (arm64 and x86_64)."
            echo "The Linux builds are statically linked against musl, so they run on any distribution."
            echo
            echo '    tar -xzf serv-'"$version"'-<target>.tar.gz'
            echo '    ./serv-'"$version"'-<target>/serv --help'
            echo
            echo 'Or build it yourself: `cargo install --git https://github.com/JWo1F/serv`.'
            echo
            echo 'Checksums are in `SHA256SUMS`.'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "serv $version" \
            --notes-file notes.md
