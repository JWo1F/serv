[package]
name = "serv"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A small, fast development server for static sites and single-page apps"
repository = "https://github.com/JWo1F/serv"
license = "MIT"
readme = "README.md"
keywords = ["http", "server", "static", "development", "spa"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
clap = { version = "4.6.6", default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
  "derive",
] }
damask = "0.11.0"
env_logger = { version = "0.11.11", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-core = "0.3.34"
http-body-util = "0.1.5"
httpdate = "1.0.3"
hyper = { version = "1.11.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio", "server"] }
log = "0.4.34"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "fs", "io-util", "macros"] }
tokio-util = { version = "0.7.19", features = ["io"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
